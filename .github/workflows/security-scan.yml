name: security-scan

on:
  push:
  workflow_call:

jobs:
  dependency-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repo code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install Poetry
        run: python -m pip install --no-cache-dir -v "poetry>=1.3,<1.4"

      - name: Export locked dependencies
        run: poetry export -f requirements.txt --without-hashes --with dev -o requirements-audit.txt

      - name: Install pip-audit
        run: python -m pip install --no-cache-dir pip-audit

      - name: Run pip-audit
        run: pip-audit -r requirements-audit.txt
