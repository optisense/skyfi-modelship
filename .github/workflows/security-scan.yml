name: security-scan

on:
  push:
  workflow_call:

jobs:
  dependency-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Check out repo code
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install Poetry
        run: python -m pip install --no-cache-dir -v "poetry>=1.3,<1.4"

      - name: Export locked dependencies
        run: poetry export -f requirements.txt --without-hashes --with dev -o requirements-audit.txt

      - name: Install pip-audit
        run: python -m pip install --no-cache-dir pip-audit

      # Non-blocking for now: the existing dependency set has pre-existing
      # vulnerable packages beyond SEC-842's scope (starlette/requests/certifi).
      # Surface findings in every run so they're visible, but don't fail
      # builds until that broader remediation is scoped and done separately.
      - name: Run pip-audit
        run: pip-audit -r requirements-audit.txt
        continue-on-error: true
